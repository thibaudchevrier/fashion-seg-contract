[project]
name = "fashion-seg-contract"
version = "0.2.0"
description = "Response contract of the fashion segmentation model: JSON Schema, RLE masks, class labels"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# numpy 1.x (trainer: TensorFlow 2.15) and 2.x (serving) must both work.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
validate = ["jsonschema>=4.18"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pylint",
    "commitizen>=4.19",
    "pre-commit>=4",
    "pydoclint>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_contract"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify, docstrings
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Every parameter, return value and raised exception is documented (numpy style), with types
# matching the signature's annotations. Tests only need short docstrings (ruff D).
[tool.pydoclint]
style = "numpy"
exclude = '\.venv|tests'
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
check-return-types = true

[tool.pytest.ini_options]
# Docstring examples are tests too.
testpaths = ["src", "tests"]
addopts = "--doctest-modules"

[tool.pylint.main]
py-version = "3.10"

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.pylint.format]
max-line-length = 100

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml and uv.lock together
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump the minor version while < 1.0
